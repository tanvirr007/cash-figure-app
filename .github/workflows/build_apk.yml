name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build Release APK
    if: github.repository_owner == 'tanvirr007'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write sign info
        if: github.repository == 'tanvirr007/cash-figure-app'
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi

      - name: Calculate next version name
        run: |
          GRADLE_VER=$(${{ github.workspace }}/gradlew -q printVersionName | tail -n 1)
          cat << 'EOF' > calculate_version.py
          import re, subprocess, sys
          def parse_version(v_str):
              match = re.search(r'(\d+)\.(\d+)\.(\d+)', v_str)
              return tuple(map(int, match.groups())) if match else (0, 0, 0)
          
          gradle_ver = sys.argv[1]
          g_maj, g_min, g_pat = parse_version(gradle_ver)
          
          try:
              latest_tag = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0'], text=True).strip()
          except Exception:
              latest_tag = 'v0.0.0'
          
          t_maj, t_min, t_pat = parse_version(latest_tag)
          
          if (g_maj, g_min, g_pat) > (t_maj, t_min, t_pat):
              next_ver = f"{g_maj}.{g_min}.{g_pat}"
          else:
              next_ver = f"{t_maj}.{t_min}.{t_pat + 1}"
          print(next_ver)
          EOF
          VERSION_NAME=$(python3 calculate_version.py "$GRADLE_VER")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Calculated version: $VERSION_NAME"
          rm calculate_version.py

      - name: Set application version name
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: "${{ env.VERSION_NAME }}"

      - name: Build with Gradle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: "${{ env.VERSION_NAME }}"
          APP_NAME: "Cash Figure"
        run: python3 scripts/bot.py monitor

      - name: Prepare APK files for release
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CashFigure-v${{ env.VERSION_NAME }}.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CashFigure.apk

      - name: Get build metadata
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          APK_SHA=$(sha256sum app/build/outputs/apk/release/CashFigure.apk | awk '{print $1}')
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          
          # Fetch previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          # Build changelog
          CHANGELOG=""
          if [ -z "$PREV_TAG" ]; then
            commits=$(git log --pretty=format:"%H %s")
          else
            commits=$(git log --pretty=format:"%H %s" $PREV_TAG..HEAD)
          fi
          
          if [ -z "$commits" ]; then
            CHANGELOG="* No changes."
          else
            while read -r hash title || [ -n "$hash" ]; do
              if [ ! -z "$hash" ]; then
                if [[ "$title" =~ ^release:\ OTA\ manifest ]] || [[ "$title" =~ ^update:\ raw\ CDN ]] || [[ "$title" =~ ^Update\ version\.json ]]; then
                  continue
                fi
                CHANGELOG="${CHANGELOG}* **$title** (${hash:0:7})"$'\n'
                body=$(git log -1 --pretty=format:"%b" "$hash" | grep -v -E "^Signed-off-by:|^Change-Id:|^Co-authored-by:" | sed '/^-\{3,\}$/,$d' | sed '/^TEST:$/,$d' | sed -e :a -e '/^[[:space:]]*$/{ $d; N; ba; }' || true)
                if [ ! -z "$body" ]; then
                  while IFS= read -r line; do
                    if [ ! -z "$line" ]; then
                      clean_line=$(echo "$line" | sed -E 's/^[[:space:]]*[-*•]+[[:space:]]*/- /')
                      CHANGELOG="${CHANGELOG}  $clean_line"$'\n'
                    fi
                  done <<< "$body"
                fi
              fi
            done <<< "$commits"
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* No changes."
          fi
          
          # Generate release_notes.md
          cat <<EOF | sed 's/^          //' > release_notes.md
          ![Cash Figure Banner](https://github.com/${{ github.repository }}/blob/main/assets/update.png?raw=true)
          
          **Cash Figure — Bangladeshi Cash Counter**
          
          > [!NOTE]
          > This release tracks build \`v${{ env.VERSION_NAME }}\` (Build ${{ github.run_number }})
          
          ### 📦 Build Information
          * **Version:** \`v${{ env.VERSION_NAME }}\`
          * **Commit:** [\`$COMMIT_HASH\`](https://github.com/${{ github.repository }}/commit/$COMMIT_HASH)
          * **Build Time:** \`${BUILD_TIME}\`
          * **Android:** \`7.0+\`
          * **SHA-256:** \`$APK_SHA\`
          
          ### 🔗 Direct Downloads
          * **Versioned APK:** [CashFigure-v${{ env.VERSION_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/CashFigure-v${{ env.VERSION_NAME }}.apk)
          * **Latest APK (Permanent Link):** [CashFigure.apk](https://github.com/${{ github.repository }}/releases/latest/download/CashFigure.apk)
          
          ### 📝 Changelog
          ${CHANGELOG}
          EOF
          echo "APK_SHA=$APK_SHA" >> $GITHUB_ENV
          echo "CHANGELOG<<EOF_CHANGELOG" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF_CHANGELOG" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "CashFigure-v${{ env.VERSION_NAME }}"
          path: app/build/outputs/apk/release/CashFigure-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Update Raw CDN version.json
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          REPOSITORY: ${{ github.repository }}
          CHANGELOG: ${{ env.CHANGELOG }}
        run: |
          python3 scripts/bot.py ota
          CHANGE_ID="Change-Id: I$(python3 -c "import hashlib, os; print(hashlib.sha1(os.urandom(32)).hexdigest())")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -s -m "release: OTA manifest v${{ env.VERSION_NAME }} [skip ci]" -m "- Auto-updated version manifest for raw GitHub CDN OTA checks"$'\n\n'"$CHANGE_ID" || exit 0
          git push origin main || echo "Warning: Failed to push version.json to main branch"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.VERSION_NAME }}" \
            --title "v${{ env.VERSION_NAME }}" \
            -F release_notes.md \
            app/build/outputs/apk/release/CashFigure-v${{ env.VERSION_NAME }}.apk \
            app/build/outputs/apk/release/CashFigure.apk --clobber || \
          (gh release edit "v${{ env.VERSION_NAME }}" -F release_notes.md && \
           gh release upload "v${{ env.VERSION_NAME }}" \
            app/build/outputs/apk/release/CashFigure-v${{ env.VERSION_NAME }}.apk \
            app/build/outputs/apk/release/CashFigure.apk --clobber)

      - name: Send Telegram Notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: "${{ env.VERSION_NAME }}"
          COMMIT_HASH: "${{ env.COMMIT_HASH }}"
          BUILD_TIME: "${{ env.BUILD_TIME }}"
          APK_SHA: "${{ env.APK_SHA }}"
          CHANGELOG: "${{ env.CHANGELOG }}"
          APK_VERSIONED_PATH: "app/build/outputs/apk/release/CashFigure-v${{ env.VERSION_NAME }}.apk"
          APK_LATEST_PATH: "app/build/outputs/apk/release/CashFigure.apk"
        run: python3 scripts/bot.py release
